[pytest]
# Make the project root importable so `import config` / `from pages...` work.
pythonpath = .

testpaths = tests

# Default options applied to every run.
# pytest-playwright provides --screenshot/--video/--tracing/--output.
# pytest-html provides the HTML report.
addopts =
    -ra
    --html=reports/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/test-results

# Custom markers.
markers =
    smoke: fast, critical-path checks.
    regression: broader coverage.
    checkout: places a real order on the demo site.

# Show logs inline for easier debugging.
log_cli = true
log_cli_level = INFO
