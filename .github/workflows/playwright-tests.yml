# ==============================================================================
# .github/workflows/playwright-tests.yml
# ------------------------------------------------------------------------------
# CI pipeline that runs the Playwright E2E suite across all three browser
# engines in parallel using a build matrix — mirroring the local cross-browser
# model. Artifacts (HTML report, traces, screenshots, videos) are uploaded on
# every run so failures can be triaged from the GitHub UI.
# ==============================================================================

name: Playwright E2E Tests

# ----------------------------------------------------------------------------
# Triggers — when the pipeline runs.
# ----------------------------------------------------------------------------
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allows manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------- #
  # Quality gate stage 1: static analysis. Fast, runs before/alongside the
  # browser tests. A lint failure blocks the gate.
  # --------------------------------------------------------------------- #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # `ruff check` fails (non-zero exit) on any lint violation.
      - name: Run ruff lint
        run: ruff check .

      # `ruff format --check` fails if code isn't formatted (doesn't rewrite).
      - name: Run ruff format check
        run: ruff format --check .

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest

    # --------------------------------------------------------------------- #
    # Matrix: one parallel job per browser engine. fail-fast=false ensures a
    # failure in one browser does not cancel the others (full visibility).
    # --------------------------------------------------------------------- #
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      # 1. Check out the repository source.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install the requested Python version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip  # Cache pip downloads keyed on requirements.txt.

      # 3. Install Python dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install the browser binaries + OS libraries for this matrix engine.
      #    --with-deps pulls the required system packages on Ubuntu.
      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      # 5. Run the suite headless against this matrix browser.
      #    `--browser` is provided by the pytest-playwright plugin.
      - name: Run E2E tests
        run: |
          pytest --browser ${{ matrix.browser }} \
            --html=reports/report-${{ matrix.browser }}.html --self-contained-html

      # 6. Always upload artifacts (even on failure) for post-run analysis.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
          retention-days: 14

  # --------------------------------------------------------------------- #
  # Quality gate stage 2: the gate itself. Runs after lint + e2e and FAILS
  # the whole workflow unless every dependency succeeded. Make this the
  # required status check in branch protection to block merges on red.
  # --------------------------------------------------------------------- #
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # Run even if a dependency failed, so we can report an accurate verdict.
    if: always()
    needs: [lint, e2e]
    steps:
      - name: Verify all required checks passed
        run: |
          echo "lint result: ${{ needs.lint.result }}"
          echo "e2e result:  ${{ needs.e2e.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Quality gate failed — see the lint/e2e jobs above."
            exit 1
          fi
          echo "✅ Quality gate passed."
